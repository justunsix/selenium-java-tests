[tools]
maven = "latest"
java = "25"
chromedriver = "latest"

[tasks.build]
run = "cd training && mvn package"

[tasks.compile]
run = "cd training && mvn compile"

[tasks.update-display-dependency-updates]
run = "cd training && mvn versions:display-dependency-updates"

[tasks.update-use-latest-releases]
run = "cd training && mvn versions:use-latest-releases"
